<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmal Garments</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f9; padding-bottom: 70px; color: #333; }
        
        header { background: #1e293b; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        
        .banner { background: #2563eb; color: white; padding: 20px; text-align: center; margin: 10px; border-radius: 10px; }
        
        .container { padding: 10px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; text-align: center; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; }
        .card h4 { font-size: 0.9rem; margin: 5px 0; }
        .card p { color: #2563eb; font-weight: bold; margin-bottom: 8px; }
        .btn { background: #1e293b; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 0.8rem; width: 100%; cursor: pointer; }
        
        .section { display: none; }
        .section.active { display: block; }

        .cart-item { background: white; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .form-group { margin-bottom: 10px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; }

        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #ccc; height: 60px; z-index: 100; }
        .nav-btn { flex: 1; border: none; background: transparent; font-size: 0.8rem; font-weight: bold; color: #666; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .nav-btn.active { color: #2563eb; }
    </style>
</head>
<body>

    <header>👕 Nirmal Garments</header>

    <div class="container">
        <!-- HOME PAGE -->
        <div id="home" class="section active">
            <div class="banner">
                <h3>Welcome to Nirmal Garments</h3>
                <p>Best Quality Clothing Store</p>
            </div>
            <div class="grid" id="productGrid"></div>
        </div>

        <!-- CART PAGE -->
        <div id="cart" class="section">
            <h3>Shopping Cart</h3>
            <div id="cartList" style="margin-top: 15px;"></div>
            <h4 style="margin: 15px 0; text-align: right;">Total: ₹<span id="cartTotal">0</span></h4>

            <div style="background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                <h4>Shipping Details</h4>
                <div class="form-group">
                    <input type="text" id="cName" placeholder="Aapka Naam">
                </div>
                <div class="form-group">
                    <input type="tel" id="cPhone" placeholder="Mobile Number">
                </div>
                <div class="form-group">
                    <textarea id="cAddress" placeholder="Pura Pata (Address)"></textarea>
                </div>
                <button class="btn" style="background: #25d366; font-size: 1rem; padding: 12px;" onclick="placeOrder()">WhatsApp Par Order Karein</button>
            </div>
        </div>

        <!-- CONTACT PAGE -->
        <div id="contact" class="section">
            <h3>Contact Us</h3>
            <div style="background: white; padding: 15px; border-radius: 8px; margin-top: 15px; line-height: 1.8;">
                <p><strong>Store:</strong> Nirmal Garments</p>
                <p><strong>WhatsApp / Call:</strong> +91 7224802868</p>
                <p><strong>Email:</strong> vijaynamdev292@gmail.com</p>
            </div>
        </div>

        <!-- ACCOUNT PAGE -->
        <div id="account" class="section">
            <h3>Admin - Add Item</h3>
            <div style="background: white; padding: 15px; border-radius: 8px; margin-top: 15px;">
                <div class="form-group">
                    <input type="text" id="pTitle" placeholder="Item Name">
                </div>
                <div class="form-group">
                    <input type="number" id="pPrice" placeholder="Price (₹)">
                </div>
                <div class="form-group">
                    <input type="text" id="pImg" placeholder="Image URL">
                </div>
                <button class="btn" onclick="addItem()">Save Item</button>
            </div>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <div class="nav">
        <button class="nav-btn active" id="btn-home" onclick="goTab('home', this)">🏠 Home</button>
        <button class="nav-btn" id="btn-cart" onclick="goTab('cart', this)">🛒 Cart (<span id="count">0</span>)</button>
        <button class="nav-btn" id="btn-contact" onclick="goTab('contact', this)">📞 Contact</button>
        <button class="nav-btn" id="btn-account" onclick="goTab('account', this)">⚙️ Admin</button>
    </div>

    <script>
        var items = JSON.parse(localStorage.getItem('ng_items')) || [
            { id: 1, name: "Casual Shirt", price: 599, img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400" },
            { id: 2, name: "Denim Jeans", price: 999, img: "https://images.unsplash.com/photo-1542272604-780c36856d66?w=400" }
        ];

        var myCart = [];

        function loadProducts() {
            var grid = document.getElementById('productGrid');
            if(!grid) return;
            grid.innerHTML = '';
            for(var i = 0; i < items.length; i++) {
                grid.innerHTML += '<div class="card">' +
                    '<img src="' + items[i].img + '">' +
                    '<h4>' + items[i].name + '</h4>' +
                    '<p>₹' + items[i].price + '</p>' +
                    '<button class="btn" onclick="addCart(' + items[i].id + ')">+ Add to Cart</button>' +
                '</div>';
            }
        }

        function goTab(tabId, btn) {
            var secs = document.getElementsByClassName('section');
            for(var i = 0; i < secs.length; i++) secs[i].classList.remove('active');
            
            var btns = document.getElementsByClassName('nav-btn');
            for(var j = 0; j < btns.length; j++) btns[j].classList.remove('active');

            var target = document.getElementById(tabId);
            if(target) target.classList.add('active');
            if(btn) btn.classList.add('active');

            if(tabId === 'cart') showCart();
        }

        function addCart(id) {
            for(var i = 0; i < items.length; i++) {
                if(items[i].id === id) {
                    myCart.push(items[i]);
                    break;
                }
            }
            document.getElementById('count').innerText = myCart.length;
            alert("Cart mein add ho gaya!");
        }

        function showCart() {
            var list = document.getElementById('cartList');
            if(!list) return;
            list.innerHTML = '';
            var sum = 0;
            if(myCart.length === 0) {
                list.innerHTML = '<p>Cart khali hai.</p>';
            } else {
                for(var i = 0; i < myCart.length; i++) {
                    sum += myCart[i].price;
                    list.innerHTML += '<div class="cart-item"><div><strong>' + myCart[i].name + '</strong><br>₹' + myCart[i].price + '</div></div>';
                }
            }
            document.getElementById('cartTotal').innerText = sum;
        }

        function addItem() {
            var title = document.getElementById('pTitle').value;
            var price = document.getElementById('pPrice').value;
            var img = document.getElementById('pImg').value || "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400";

            if(!title || !price) {
                alert("Naam aur Price likhein!");
                return;
            }

            items.push({ id: Date.now(), name: title, price: Number(price), img: img });
            localStorage.setItem('ng_items', JSON.stringify(items));
            alert("Saved!");
            document.getElementById('pTitle').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImg').value = '';
            loadProducts();
            goTab('home', document.getElementById('btn-home'));
        }

        function placeOrder() {
            if(myCart.length === 0) { alert("Cart khali hai!"); return; }
            var name = document.getElementById('cName').value;
            var phone = document.getElementById('cPhone').value;
            var address = document.getElementById('cAddress').value;
            if(!name || !phone || !address) { alert("Pura form bharein!"); return; }

            var txt = "*Naya Order - Nirmal Garments*\nName: " + name + "\nPhone: " + phone + "\nAddress: " + address + "\n\nItems:\n";
            var total = 0;
            for(var i = 0; i < myCart.length; i++) {
                txt += "- " + myCart[i].name + " (₹" + myCart[i].price + ")\n";
                total += myCart[i].price;
            }
            txt += "\nTotal: ₹" + total;

            window.open("https://wa.me/917224802868?text=" + encodeURIComponent(txt), '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
